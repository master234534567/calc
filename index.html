<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Launcher</title>
    <style>
      :root {
        --bg-1: #09111f;
        --bg-2: #121b2a;
        --panel: rgba(17, 26, 38, 0.9);
        --primary: #7dd3fc;
        --accent: #34d399;
        --text: #e7f3ff;
        --muted: #90a4c0;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      #calculator {
        width: min(90vw, 380px);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
        padding: 22px;
      }

      .display {
        width: 100%;
        height: 110px;
        border-radius: 16px;
        background: rgba(10, 15, 24, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.22);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 18px;
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--primary);
        overflow: hidden;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        font-size: 1.2rem;
        font-weight: 700;
        height: 60px;
        cursor: pointer;
        color: var(--text);
        background: rgba(148, 163, 184, 0.14);
        transition: transform 0.12s ease, background 0.12s ease;
      }

      button:hover {
        background: rgba(125, 211, 252, 0.18);
      }

      button:active {
        transform: scale(0.98);
      }

      .action {
        background: rgba(52, 211, 153, 0.15);
        color: var(--accent);
      }

      .operator {
        background: rgba(125, 211, 252, 0.14);
        color: var(--primary);
      }

      .equals {
        grid-column: span 3;
      }

      .danger {
        background: rgba(248, 113, 113, 0.14);
        color: #fecaca;
      }

      @media (max-width: 420px) {
        #calculator {
          padding: 18px;
        }

        button {
          height: 58px;
        }
      }
    </style>
  </head>
  <body>
    <div id="calculator" aria-live="polite">
      <div id="display" class="display">0</div>
      <div class="keypad">
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="operator" data-operator="/">÷</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" class="operator" data-operator="*">×</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" class="operator" data-operator="-">−</button>

        <button type="button" class="danger" data-action="clear">C</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" class="operator" data-operator="+">+</button>

        <button type="button" class="action" data-action="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="action equals" data-action="enter">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');
      let input = '';
      let accumulator = null;
      let pendingOperator = null;
      let replaceInput = false;

      const operatorSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      function formatNumber(value) {
        if (!Number.isFinite(value)) {
          return 'Error';
        }
        return String(Number(value.toPrecision(10)));
      }

      const renderDisplay = () => {
        if (pendingOperator) {
          display.textContent = `${formatNumber(accumulator)} ${operatorSymbols[pendingOperator]} ${input || '0'}`;
          return;
        }
        display.textContent = input || (accumulator === null ? '0' : formatNumber(accumulator));
      };

      function addDigit(digit) {
        if (replaceInput) {
          input = '';
          replaceInput = false;
        }
        if (input.length >= 14) {
          return;
        }
        input += digit;
        renderDisplay();

        if (accumulator === null && pendingOperator === null && input === '0000') {
          launchGame();
        }
      }

      function applyOperator(first, second, operator) {
        if (operator === '+') return first + second;
        if (operator === '-') return first - second;
        if (operator === '*') return first * second;
        if (operator === '/') return second === 0 ? NaN : first / second;
        return second;
      }

      function chooseOperator(operator) {
        if (input === '' && accumulator === null) {
          return;
        }
        if (pendingOperator && input !== '') {
          accumulator = applyOperator(accumulator, Number(input), pendingOperator);
          if (!Number.isFinite(accumulator)) {
            showCalculationError();
            return;
          }
        } else if (accumulator === null) {
          accumulator = Number(input || 0);
        }
        input = '';
        pendingOperator = operator;
        replaceInput = false;
        renderDisplay();
      }

      function calculate() {
        if (pendingOperator === null || input === '') {
          return;
        }
        const result = applyOperator(accumulator, Number(input), pendingOperator);
        if (!Number.isFinite(result)) {
          showCalculationError();
          return;
        }
        input = formatNumber(result);
        accumulator = null;
        pendingOperator = null;
        replaceInput = true;
        renderDisplay();
      }

      function showCalculationError() {
        input = '';
        accumulator = null;
        pendingOperator = null;
        replaceInput = true;
        display.textContent = 'Error';
      }

      function clearCalculator() {
        input = '';
        accumulator = null;
        pendingOperator = null;
        replaceInput = false;
        renderDisplay();
      }

      function addDecimal() {
        if (replaceInput) {
          input = '';
          replaceInput = false;
        }
        if (input === '') {
          input = '0';
        }
        if (!input.includes('.')) {
          input += '.';
        }
        renderDisplay();
      }

      function backspace() {
        if (replaceInput) {
          return;
        }
        input = input.slice(0, -1);
        renderDisplay();
      }

      document.querySelectorAll('[data-digit]').forEach((button) => {
        button.addEventListener('click', () => addDigit(button.dataset.digit));
      });

      document.querySelectorAll('[data-operator]').forEach((button) => {
        button.addEventListener('click', () => chooseOperator(button.dataset.operator));
      });

      document.querySelector('[data-action="clear"]').addEventListener('click', () => {
        clearCalculator();
      });

      document.querySelector('[data-action="enter"]').addEventListener('click', () => {
        if (input === '0000') {
          launchGame();
        } else {
          calculate();
        }
      });

      document.querySelector('[data-action="decimal"]').addEventListener('click', addDecimal);
      document.querySelector('[data-action="backspace"]').addEventListener('click', backspace);

      document.addEventListener('keydown', (event) => {
        if (/^[0-9]$/.test(event.key)) {
          event.preventDefault();
          addDigit(event.key);
        } else if (['+', '-', '*', '/'].includes(event.key)) {
          event.preventDefault();
          chooseOperator(event.key);
        } else if (event.key === 'Enter' || event.key === '=') {
          event.preventDefault();
          if (input === '0000') {
            launchGame();
          } else {
            calculate();
          }
        } else if (event.key === '.') {
          event.preventDefault();
          addDecimal();
        } else if (event.key === 'Backspace') {
          event.preventDefault();
          backspace();
        } else if (event.key === 'Escape' || event.key === 'Delete') {
          event.preventDefault();
          clearCalculator();
        }
      });

      function launchGame() {
        const gameTab = window.open('about:blank', '_blank');
        if (!gameTab) {
          display.textContent = 'Allow pop-ups';
          input = '';
          return;
        }

        const gameDocument = gameTab.document;
        gameDocument.open();
        gameDocument.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Loading...</title></head><body>Loading...</body></html>');
        gameDocument.close();

        const currentUrl = new URL(window.location.href);
        const appBase = currentUrl.pathname.endsWith('/')
          ? currentUrl
          : /\.html?$/i.test(currentUrl.pathname)
            ? new URL('.', currentUrl)
            : new URL(`${currentUrl.pathname}/`, currentUrl.origin);
        const gameUrl = new URL('library.html', appBase);
        fetch(gameUrl)
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Could not load the site (${response.status})`);
            }
            return response.text();
          })
          .then((html) => {
            if (gameTab.closed) {
              return;
            }

            const siteDocument = new DOMParser().parseFromString(html, 'text/html');
            const base = siteDocument.createElement('base');
            base.href = new URL('.', gameUrl).href;
            siteDocument.head.prepend(base);

            gameDocument.open();
            gameDocument.write(`<!DOCTYPE html>${siteDocument.documentElement.outerHTML}`);
            gameDocument.close();
          })
          .catch((error) => {
            if (!gameTab.closed) {
              gameDocument.body.textContent = `Could not load the site: ${error.message}`;
            }
          });
      }
    </script>
  </body>
</html>
