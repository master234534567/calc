<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #4CAF50; margin-top: 0; }
    .search-container { max-width: 600px; margin: 0 auto 20px; text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; }
    ul { list-style: none; padding: 0; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
    .item { min-width: 0; transition: transform 180ms ease; }
    .item:hover, .item:focus-within { transform: scale(1.05); position: relative; z-index: 1; }
    .game-card { display: flex; flex-direction: column; width: 100%; padding: 0; overflow: hidden; text-align: left; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); }
    .game-card:hover { background: #252525; }
    .game-art { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: linear-gradient(135deg, #173b4a, #25345a 55%, #3c2450); }
    .game-art img { width: 100%; height: 100%; object-fit: cover; }
    .game-art-fallback { padding: 12px; color: #fff; font-size: 22px; font-weight: 800; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7); }
    .item-title { display: -webkit-box; min-height: 48px; padding: 12px; overflow: hidden; font-weight: bold; font-size: 15px; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    button { background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #status { text-align: center; color: #888; margin-top: 20px; }

    /* Fullscreen Game Player View */
    #game-container {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999;
      flex-direction: column;
    }
    .top-bar {
      height: 48px; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333;
    }
    .top-bar-title { font-weight: bold; font-size: 16px; color: #fff; }
    .btn-group { display: flex; gap: 10px; }
    .top-btn {
      background: #333; color: #fff; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .top-btn:hover { background: #444; }
    .top-btn.reload-btn { background: #4CAF50; border-color: #4CAF50; }
    .top-btn.reload-btn:hover { background: #45a049; }
    iframe { flex: 1; width: 100%; border: none; }
    #game-error { flex: 1; display: grid; place-items: center; padding: 24px; color: #ddd; text-align: center; }
    #game-error[hidden] { display: none; }
  </style>

<script id="fullscreen-script">
  function toggleFullScreen(elementId) {
    const el = elementId ? document.getElementById(elementId) : document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) { /* Safari */
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) { /* IE11 */
        el.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
</script>


<script id="autosave-script">
  // Save last played game or scroll position automatically
  window.addEventListener("beforeunload", () => {
    try {
      const activeGame = document.querySelector("iframe") ? document.querySelector("iframe").src : "";
      const state = {
        lastGame: activeGame,
        scrollPos: window.scrollY,
        timestamp: Date.now()
      };
      localStorage.setItem("gameLibraryState", JSON.stringify(state));
    } catch (e) {
      console.error("Auto-save failed:", e);
    }
  });

  // Restore state on load
  window.addEventListener("DOMContentLoaded", () => {
    try {
      const saved = localStorage.getItem("gameLibraryState");
      if (saved) {
        const state = JSON.parse(saved);
        if (state.scrollPos) {
          window.scrollTo(0, state.scrollPos);
        }
        // If you want to auto-load the last game, you can hook into this data here!
        console.log("Restored previous session from:", new Date(state.timestamp).toLocaleTimeString());
      }
    } catch (e) {
      console.error("Failed to load saved state:", e);
    }
  });
</script>


<script id="safeloader-script">
  function loadGameSafely(gameUrl) {
    const container = document.getElementById("game-container") || document.body;
    
    // Remove existing game frame if any
    const oldFrame = document.getElementById("active-game-frame");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "active-game-frame";
    iframe.src = gameUrl;
    iframe.width = "100%";
    iframe.height = "100%";
    // Sandbox restriction to protect the main library site from crashes
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock allow-forms");
    iframe.style.border = "none";
    
    iframe.onerror = () => {
      alert("Failed to load or execute this game. It might require specific server assets (like .wasm files).");
    };

    container.appendChild(iframe);
  }
</script>

</head>
<body>

  <div id="library-view">
    <h1>Library</h1>
    <div id="game-count" style="text-align: center; color: #888; margin-bottom: 15px; font-weight: bold;">Total Games: 0</div>
    <div class="search-container">
      <input type="text" id="search" placeholder="Search games..." oninput="filterItems()">
    </div>
    <div id="status">Loading games...</div>
    <ul id="list"></ul>
  </div>

  <div id="game-container">
    <div class="top-bar">
      <span class="top-bar-title" id="current-game-title">Game</span>
      <div class="btn-group">
        <button class="top-btn reload-btn" onclick="reloadGame()">Reload</button>
        <button class="top-btn" onclick="toggleFullScreen('game-container')">Fullscreen ⛶</button>
        <button class="top-btn" onclick="closeGame()">Back to Library</button>
      </div>
    </div>
    <div id="game-error" role="status" hidden></div>
    <iframe id="game-frame" src=""></iframe>
  </div>

      ["gamelist/The-Impossible-Quiz-Deluxe", "gamelist/The-Impossible-Quiz-Deluxe/theimpossiblequiz.png"],
      ["gamelist/Troll-Face-Quest-2", "gamelist/Troll-Face-Quest-2/trollface-quest-2.jpg"],
      ["gamelist/Troll-Face-Quest-3", "gamelist/Troll-Face-Quest-3/trollface-quest-3.jpg"],
      ["gamelist/Troll-Face-Quest-4", "gamelist/Troll-Face-Quest-4/trollface-quest-4.jpg"],
      ["gamelist/Troll-Face-Quest-5", "gamelist/Troll-Face-Quest-5/trollface-quest-5.jpg"],

      ["gamelist/Unicycle-Heroes", "gamelist/Unicycle-Heroes/unicyclehero.jpg"],
      ["gamelist/YOMI-HUSTLE", "gamelist/YOMI-HUSTLE/yomi.png"],
      ["gamelist/bob-the-robber-2", "gamelist/bob-the-robber-2/splash.jpeg"]
    ]);
    const gameFallbackAliases = new Map([
      ["18wasm", "Offline-HTML-Games-Pack-master/offline/1.8.html"],
      ["8ballclassic", "gamelist/8-Ball-Billiards-Classic/index.html"],

      ["baldisbasics", "gamelist/Baldis-Basics-Classic-Remastered/index.html"],
      ["basketballlegends", "gamelist/Basketball-Legends-2020/index.html"],
      ["bigicetowertinysquare", "gamelist/Big-Tower-Tiny-Square-2/index.html"],
      ["bigneontowertinysquare", "gamelist/Big-Tower-Tiny-Square-2/index.html"],
      ["bigtowertinysquare", "gamelist/Big-Tower-Tiny-Square-2/index.html"],
      ["bloonstd", "gamelist/Bloons-Tower-Defence/index.html"],
      ["bloonstd2", "gamelist/Bloons-Tower-Defence-2/index.html"],
      ["bloonstd3", "gamelist/Bloons-Tower-Defence-3/index.html"],
      ["bloonstd4", "gamelist/BTD-4/index.html"],
      ["burritobisonlaunchalibre", "gamelist/Burrito-Bison-3/index.html"],
      ["chess", "gamelist/Chess-Classic/index.html"],
      ["circloo2", "gamelist/circloO/index.html"],
      ["cuttheropeholidaygift", "gamelist/Cut-The-Rope-Holiday/index.html"],
      ["drifthunterspro", "gamelist/Drift-Hunters/index.html"],
      ["fancypantsadventure", "gamelist/Fancy-Pants-Adventures/index.html"],
      ["fnaf", "gamelist/FNAF-1/index.html"]
    ]);

    function normalizeGameName(name) {
      return name.toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getTitle(filename) {
      if (!filename) return "";
      let base = filename.toString();
      base = base.replace(/\.(html|htm)$/i, "");
      if (/\/index$/i.test(base) || /^index$/i.test(base)) {
        base = base.replace(/\/index$/i, "");
      }
      let parts = base.split("/").filter(Boolean);
      if (parts.length > 0) {
        const boilerplate = ["offline html games pack master", "gamelist", "offline", "originals", "patch", "dist", "build"];
        let selected = parts[parts.length - 1];
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i].toLowerCase().trim();
          if (!boilerplate.includes(p)) {
            selected = parts[i];
            break;
          }
        }
        base = selected;
      }
      base = base.replace(/offline\s*pack/gi, "")
                 .replace(/offline html games pack master/gi, "")
                 .replace(/gamelist/gi, "")
                 .replace(/offline/gi, "")
                 .replace(/[-_]+/g, " ")
                 .trim();
      if (!base) base = filename;
      return base.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    async function openGame(url, title) {
      currentGameTitle.textContent = title;
      gameFrame.hidden = true;
      gameError.hidden = true;
      gameContainer.style.display = "flex";

      const nestedGame = url.match(/^gamelist\/([^/]+)\//i);
      if (nestedGame) {
        const parentGame = `gamelist/${nestedGame[1]}/index.html`;
        if (url !== parentGame && gamePaths.has(parentGame)) {
          url = parentGame;
        }
      }

      try {
        const response = await fetch(url, { method: "HEAD" });
        if (response.status === 404) {
          gameError.textContent = `${title} could not be found.`;
          gameError.hidden = false;
          return;
        }

        if (
          url.startsWith("Offline-HTML-Games-Pack-master/offline/") &&
          response.ok &&
          response.headers.get("content-length") === "0"
        ) {
          const filename = url.split("/").pop().replace(/\.(html?|htm)$/i, "");
          const key = normalizeGameName(filename);
          const fallback = gameFallbacks.get(key) || gameFallbackAliases.get(key);
          if (fallback && fallback !== url) {
            url = fallback;
            currentGameTitle.textContent = getTitle(fallback);
          } else {
            gameError.textContent = `${title} is an empty offline-pack placeholder, and no matching playable page was found in the game library.`;
            gameError.hidden = false;
            return;
          }
        }
      } catch (error) {
        console.warn(`Could not check ${url} before loading:`, error);
      }

      gameFrame.src = url;
      gameFrame.hidden = false;
    }

    function reloadGame() {
      if (gameFrame.src) {
        gameFrame.contentWindow.location.reload();
      }
    }

    function closeGame() {
      gameContainer.style.display = "none";
      gameFrame.src = "";
      gameError.hidden = true;
    }

    async function loadGames() {
      try {
        const [response, imageResponse] = await Promise.all([
          fetch("games-manifest.json", { cache: "no-store" }),
          fetch("game-art-manifest.json", { cache: "no-store" })
        ]);
        if (!response.ok) throw new Error("Unable to load game manifest.");
        const filenames = await response.json();
        gameImageManifest = imageResponse.ok ? await imageResponse.json() : {};
        gamePaths = new Set(filenames);
        gameFallbacks = new Map();
        filenames.forEach((filename) => {
          const match = filename.match(/^gamelist\/([^/]+)\/index\.html$/i);
          if (match) {
            const key = normalizeGameName(match[1]);
            if (!gameFallbacks.has(key)) gameFallbacks.set(key, filename);
          }
        });
        
        list.innerHTML = "";
        const fragment = document.createDocumentFragment();

        filenames.forEach((filename) => {
          const title = getTitle(filename);
          const item = document.createElement("li");
          item.className = "item";
          item.dataset.name = `${title} ${filename}`.toLowerCase();

          const button = document.createElement("button");
          button.className = "game-card";
          button.type = "button";
          button.setAttribute("aria-label", `Play ${title}`);
          button.onclick = () => openGame(filename, title);

          const art = document.createElement("span");
          art.className = "game-art";
          art.setAttribute("aria-hidden", "true");

          const fallback = document.createElement("span");
          fallback.className = "game-art-fallback";
          fallback.textContent = title;
          art.append(fallback);

          const imageCandidates = getImageCandidates(filename);
          if (imageCandidates.length > 0) {
            const image = document.createElement("img");
            image.alt = "";
            const mappedOfflineImage = filename.startsWith("Offline-HTML-Games-Pack-master/offline/")
              && Boolean(gameImageManifest[filename]);
            image.loading = mappedOfflineImage ? "eager" : "lazy";
            image.decoding = "async";
            image.onload = () => {
              fallback.hidden = true;
            };
            let candidateIndex = 0;
            image.onerror = () => {
              candidateIndex += 1;
              if (candidateIndex < imageCandidates.length) {
                image.src = imageCandidates[candidateIndex];
              } else {
                image.remove();
              }
            };
            image.src = imageCandidates[candidateIndex];
            art.prepend(image);
          }

          const titleElement = document.createElement("span");
          titleElement.className = "item-title";
          titleElement.textContent = title;
          button.append(art, titleElement);
          item.append(button);
          fragment.append(item);
        });

        list.append(fragment);
        status.textContent = filenames.length === 0 ? "No games found." : "";
        document.getElementById("game-count").textContent = `Total Games: ${filenames.length}`;
        filterItems();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function getImageCandidates(filename) {
      if (Object.prototype.hasOwnProperty.call(gameImageManifest, filename)) {
        const image = gameImageManifest[filename];
        return image ? [image] : [];
      }

      if (filename.startsWith("Offline-HTML-Games-Pack-master/offline/")) {
        const image = gameImageManifest[filename];
        return image ? [image] : [];
      }

      const pathParts = filename.split("/");
      const gameDirectory = pathParts[0] === "gamelist" && pathParts.length > 2
        ? `gamelist/${pathParts[1]}`
        : pathParts.slice(0, -1).join("/");
      const gameName = pathParts[0] === "gamelist" && pathParts.length > 2
        ? pathParts[1]
        : (pathParts[pathParts.length - 1] || "").replace(/\.(html?|htm)$/i, "");
      if (!gameDirectory || !gameName) return [];

      const names = [...new Set([
        gameName,
        gameName.toLowerCase(),
        gameName.replace(/[^a-z0-9]/gi, ""),
        gameName.replace(/[^a-z0-9]/gi, "").toLowerCase()
      ])];
      const extensions = ["png", "jpg", "jpeg", "webp", "gif"];
      const candidates = names.flatMap((name) =>
        extensions.map((extension) => `${gameDirectory}/${name}.${extension}`)
      );
      const override = gameImageOverrides.get(gameDirectory);
      return override ? [override, ...candidates] : candidates;
    }

    function filterItems() {
      const query = search.value.toLowerCase();
      const items = list.getElementsByClassName("item");
      for (let item of items) {
        const name = item.dataset.name;
        item.style.display = name.includes(query) ? "" : "none";
      }
    }

    loadGames();
  </script>
