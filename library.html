<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #4CAF50; margin-top: 0; }
    .search-container { max-width: 600px; margin: 0 auto 20px; text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; }
    ul { list-style: none; padding: 0; max-width: 800px; margin: 0 auto; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 16px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #2a2a2a; }
    .item-title { font-weight: bold; font-size: 16px; }
    button { background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #status { text-align: center; color: #888; margin-top: 20px; }

    /* Fullscreen Game Player View */
    #game-container {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999;
      flex-direction: column;
    }
    .top-bar {
      height: 48px; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333;
    }
    .top-bar-title { font-weight: bold; font-size: 16px; color: #fff; }
    .btn-group { display: flex; gap: 10px; }
    .top-btn {
      background: #333; color: #fff; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .top-btn:hover { background: #444; }
    .top-btn.reload-btn { background: #4CAF50; border-color: #4CAF50; }
    .top-btn.reload-btn:hover { background: #45a049; }
    iframe { flex: 1; width: 100%; border: none; }
  </style>

<style id="fullscreen-style">
  .fullscreen-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 9999;
    padding: 8px 14px;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .fullscreen-btn:hover {
    background: rgba(0, 0, 0, 0.9);
  }
</style>


<script id="fullscreen-script">
  function toggleFullScreen(elementId) {
    const el = elementId ? document.getElementById(elementId) : document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) { /* Safari */
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) { /* IE11 */
        el.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
</script>

</head>
<body>

  <div id="library-view">
    <h1>Library</h1>
    <div id="game-count" style="text-align: center; color: #888; margin-bottom: 15px; font-weight: bold;">Total Games: 0</div>
    <div class="search-container">
      <input type="text" id="search" placeholder="Search games..." oninput="filterItems()">
    </div>
    <div id="status">Loading games...</div>
    <ul id="list"></ul>
  </div>

  <div id="game-container">
    <div class="top-bar">
      <span class="top-bar-title" id="current-game-title">Game</span>
      <div class="btn-group">
        <button class="top-btn reload-btn" onclick="reloadGame()">Reload</button>
        <button class="top-btn" onclick="closeGame()">Back to Library</button>
      </div>
    </div>
    <iframe id="game-frame" src=""></iframe>
  </div>

  <script>
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const gameContainer = document.getElementById("game-container");
    const gameFrame = document.getElementById("game-frame");
    const currentGameTitle = document.getElementById("current-game-title");

    function getTitle(filename) {
      if (!filename) return "";
      let base = filename.toString();
      base = base.replace(/\.(html|htm)$/i, "");
      if (/\/index$/i.test(base) || /^index$/i.test(base)) {
        base = base.replace(/\/index$/i, "");
      }
      let parts = base.split("/").filter(Boolean);
      if (parts.length > 0) {
        const boilerplate = ["offline html games pack master", "gamelist", "offline", "originals", "patch", "dist", "build"];
        let selected = parts[parts.length - 1];
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i].toLowerCase().trim();
          if (!boilerplate.includes(p)) {
            selected = parts[i];
            break;
          }
        }
        base = selected;
      }
      base = base.replace(/offline\s*pack/gi, "")
                 .replace(/offline html games pack master/gi, "")
                 .replace(/gamelist/gi, "")
                 .replace(/offline/gi, "")
                 .replace(/[-_]+/g, " ")
                 .trim();
      if (!base) base = filename;
      return base.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function openGame(url, title) {
      currentGameTitle.textContent = title;
      gameFrame.src = url;
      gameContainer.style.display = "flex";
    }

    function reloadGame() {
      if (gameFrame.src) {
        gameFrame.contentWindow.location.reload();
      }
    }

    function closeGame() {
      gameContainer.style.display = "none";
      gameFrame.src = "";
    }

    async function loadGames() {
      try {
        const response = await fetch("games-manifest.json");
        if (!response.ok) throw new Error("Unable to load game manifest.");
        const filenames = await response.json();
        
        list.innerHTML = "";
        const fragment = document.createDocumentFragment();

        filenames.forEach((filename) => {
          const title = getTitle(filename);
          const item = document.createElement("li");
          item.className = "item";
          item.dataset.name = `${title} ${filename}`.toLowerCase();

          const details = document.createElement("div");
          const titleElement = document.createElement("span");
          titleElement.className = "item-title";
          titleElement.textContent = title;
          details.append(titleElement);

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Play";
          button.onclick = () => openGame(filename, title);

          item.append(details, button);
          fragment.append(item);
        });

        list.append(fragment);
        status.textContent = filenames.length === 0 ? "No games found." : "";
        document.getElementById("game-count").textContent = `Total Games: ${filenames.length}`;
        filterItems();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function filterItems() {
      const query = search.value.toLowerCase();
      const items = list.getElementsByClassName("item");
      for (let item of items) {
        const name = item.dataset.name;
        item.style.display = name.includes(query) ? "flex" : "none";
      }
    }

    loadGames();
  </script>
</body>
</html>
