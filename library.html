<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #18221f;
        background: #f4f6f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 76px;
        padding: 0 max(24px, calc((100vw - 1040px) / 2));
        border-bottom: 1px solid #dce2de;
        background: #fff;
      }

      .brand {
        color: #176b52;
        font-size: 14px;
        font-weight: 700;
      }

      main {
        width: min(100% - 40px, 920px);
        margin: 64px auto;
      }

      .heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font: 400 34px Georgia, 'Times New Roman', serif;
      }

      .subheading,
      .count,
      .item-kind,
      #status {
        color: #65736d;
        font-size: 14px;
      }

      .subheading {
        margin: 0;
      }

      .search {
        width: min(100%, 260px);
        height: 42px;
        padding: 0 12px;
        border: 1px solid #cbd5ce;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .list {
        margin: 0;
        padding: 0;
        border-top: 1px solid #dce2de;
        list-style: none;
      }

      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 20px;
        min-height: 82px;
        padding: 16px 4px;
        border-bottom: 1px solid #dce2de;
      }

      .item-title {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
      }

      .item-kind {
        display: block;
        font-size: 12px;
      }

      button {
        min-width: 82px;
        height: 38px;
        padding: 0 14px;
        border: 1px solid #176b52;
        border-radius: 4px;
        background: #176b52;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #10543f;
      }

      button:focus-visible,
      .search:focus-visible {
        outline: 3px solid #9bc8b5;
        outline-offset: 2px;
      }

      #status {
        min-height: 20px;
        margin-top: 18px;
      }

      @media (max-width: 560px) {
        header {
          min-height: 64px;
        }

        main {
          margin-top: 36px;
        }

        .heading {
          align-items: stretch;
          flex-direction: column;
          gap: 18px;
        }

        .search {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Library</span>
      <span class="count" id="count">1 item</span>
    </header>
    <main>
      <div class="heading">
        <div>
          <h1>Library</h1>
          <p class="subheading">Choose an item to open.</p>
        </div>
        <input class="search" id="search" type="search" placeholder="Filter items" aria-label="Filter items" />
      </div>
      <ul class="list" id="items">
        <li class="item" data-name="cloverpit">
          <div>
            <span class="item-title">CloverPit</span>
            <span class="item-kind">Local build</span>
          </div>
          <button type="button" data-page="game.html">Open</button>
        </li>
      </ul>
      <p id="status" role="status" aria-live="polite">Loading games...</p>
    </main>
    <script>
      const list = document.getElementById('items');
      const search = document.getElementById('search');
      const count = document.getElementById('count');
      const status = document.getElementById('status');

      function filterItems() {
        const query = search.value.trim().toLowerCase();
        let visibleCount = 0;
        list.querySelectorAll('.item').forEach((item) => {
          const visible = item.dataset.name.includes(query);
          item.hidden = !visible;
          visibleCount += Number(visible);
        });
        count.textContent = `${visibleCount} ${visibleCount === 1 ? 'item' : 'items'}`;
      }

      search.addEventListener('input', filterItems);

      list.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-page]');
        if (!button) {
          return;
        }

        status.textContent = 'Opening...';
        try {
          const targetUrl = new URL(button.dataset.page, document.baseURI);
          const response = await fetch(targetUrl);
          if (!response.ok) {
            throw new Error(`Unable to load item (${response.status})`);
          }

          const page = new DOMParser().parseFromString(await response.text(), 'text/html');
          const base = page.createElement('base');
          base.href = new URL('.', targetUrl).href;
          page.head.prepend(base);

          document.open();
          document.write(`<!DOCTYPE html>${page.documentElement.outerHTML}`);
          document.close();
        } catch (error) {
          status.textContent = error.message;
        }
      });

      async function loadGames() {
        try {
          const response = await fetch('offline-games.json');
          if (!response.ok) {
            throw new Error(`Unable to load game list (${response.status})`);
          }

          const filenames = await response.json();
          const fragment = document.createDocumentFragment();
          filenames.forEach((filename) => {
            const title = filename
              .replace(/\.html?$/i, '')
              .replace(/[-_]+/g, ' ')
              .replace(/\b[a-z]/g, (letter) => letter.toUpperCase());
            const item = document.createElement('li');
            item.className = 'item';
            item.dataset.name = `${title} ${filename}`.toLowerCase();

            const details = document.createElement('div');
            const titleElement = document.createElement('span');
            titleElement.className = 'item-title';
            titleElement.textContent = title;
            const kind = document.createElement('span');
            kind.className = 'item-kind';
            kind.textContent = 'Offline HTML';
            details.append(titleElement, kind);

            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.page = `games/offline/${filename}`;
            button.textContent = 'Open';
            item.append(details, button);
            fragment.append(item);
          });

          list.append(fragment);
          status.textContent = '';
          filterItems();
        } catch (error) {
          status.textContent = error.message;
          filterItems();
        }
      }

      loadGames();
    </script>
  </body>
</html>
