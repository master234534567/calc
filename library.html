<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Game Library</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #4CAF50; }
    .search-container { max-width: 600px; margin: 0 auto 20px; text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; box-sizing: border-box; }
    ul { list-style: none; padding: 0; max-width: 800px; margin: 0 auto; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 16px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #2a2a2a; }
    .item-title { font-weight: bold; font-size: 16px; }
    button { background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #status { text-align: center; color: #888; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Local Game Library</h1>
  <div class="search-container">
    <input type="text" id="search" placeholder="Search games..." oninput="filterItems()">
  </div>
  <div id="status">Loading games...</div>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const search = document.getElementById("search");

    function getTitle(filename) {
      let base = filename;
      const lower = filename.toLowerCase();
      if (lower.endsWith("/index.html") || lower.endsWith("/index.htm")) {
        const parts = filename.split("/");
        base = parts[parts.length - 2] || parts[0];
      } else {
        base = filename.replace(/\.html?$/i, "");
      }
      return base
        .replace(/[-_]+/g, " ")
        .replace(/\b[a-z]/g, (letter) => letter.toUpperCase());
    }

    async function loadGames() {
      try {
        const response = await fetch("offline-games.json");
        if (!response.ok) throw new Error("Unable to load game manifest.");
        const filenames = await response.json();
        
        list.innerHTML = "";
        const fragment = document.createDocumentFragment();

        filenames.forEach((filename) => {
          const title = getTitle(filename);
          const item = document.createElement("li");
          item.className = "item";
          item.dataset.name = `${title} ${filename}`.toLowerCase();

          const details = document.createElement("div");
          const titleElement = document.createElement("span");
          titleElement.className = "item-title";
          titleElement.textContent = title;
          details.append(titleElement);

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Play";
          button.onclick = () => { window.location.href = filename; };

          item.append(details, button);
          fragment.append(item);
        });

        list.append(fragment);
        status.textContent = filenames.length === 0 ? "No games found in local folders." : "";
        filterItems();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function filterItems() {
      const query = search.value.toLowerCase();
      const items = list.getElementsByClassName("item");
      for (let item of items) {
        const name = item.dataset.name;
        item.style.display = name.includes(query) ? "flex" : "none";
      }
    }

    loadGames();
  </script>
</body>
</html>
