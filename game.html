<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloverPit</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body,
      #unity-container {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: fixed;
        inset: 0;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #loading-text {
        position: fixed;
        z-index: 2;
        top: 18px;
        left: 0;
        width: 100%;
        margin: 0;
        color: #fff;
        font: 16px sans-serif;
        text-align: center;
      }

      #unity-loading-bar {
        display: block;
        z-index: 1;
      }

      #unity-error {
        position: fixed;
        z-index: 3;
        inset: auto 16px 16px;
        padding: 12px;
        color: #fff;
        background: #7f1d1d;
        font: 14px sans-serif;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <p id="loading-text" role="status">Loading CloverPit assets...</p>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <div id="unity-error" role="alert" hidden></div>
    <script>
      const loadingText = document.getElementById('loading-text');
      const progressBar = document.getElementById('unity-progress-bar-full');
      const errorBox = document.getElementById('unity-error');
      const totalAssetBytes = 91180348;
      let loadedAssetBytes = 0;

      async function loadParts(path, count, contentType) {
        const parts = await Promise.all(
          Array.from({ length: count }, async (_, index) => {
            const url = `Build/${path}.part${index + 1}`;
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Could not load ${url} (${response.status})`);
            }

            const blob = await response.blob();
            loadedAssetBytes += blob.size;
            const loadedMb = (loadedAssetBytes / 1048576).toFixed(1);
            const totalMb = (totalAssetBytes / 1048576).toFixed(1);
            loadingText.textContent = `Loading CloverPit assets... ${loadedMb} / ${totalMb} MB`;
            return blob;
          })
        );

        return URL.createObjectURL(new Blob(parts, { type: contentType }));
      }

      function showError(error) {
        errorBox.hidden = false;
        errorBox.textContent = `CloverPit could not start: ${error.message || error}`;
        loadingText.hidden = true;
        console.error(error);
      }

      async function startGame() {
        try {
          const [dataUrl, codeUrl] = await Promise.all([
            loadParts('CloverPit.data', 3, 'application/octet-stream'),
            loadParts('CloverPit.wasm', 3, 'application/wasm'),
          ]);

          const config = {
            arguments: [],
            dataUrl,
            frameworkUrl: 'Build/CloverPit.framework.js',
            codeUrl,
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'Panik Arcade',
            productName: 'CloverPit',
            productVersion: '1.3',
            showBanner(message) {
              console.warn(message);
            },
          };

          const loader = document.createElement('script');
          loader.src = 'Build/CloverPit.loader.js';
          loader.onerror = () => showError('The Unity loader could not be loaded.');
          loader.onload = () => {
            createUnityInstance(
              document.getElementById('unity-canvas'),
              config,
              (progress) => {
                progressBar.style.width = `${100 * progress}%`;
                loadingText.textContent = `Starting CloverPit... ${Math.round(progress * 100)}%`;
              }
            )
              .then(() => {
                document.getElementById('unity-loading-bar').style.display = 'none';
                loadingText.hidden = true;
              })
              .catch(showError);
          };
          document.body.appendChild(loader);
        } catch (error) {
          showError(error);
        }
      }

      startGame();
    </script>
  </body>
</html>
