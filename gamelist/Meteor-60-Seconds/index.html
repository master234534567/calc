<!DOCTYPE html>
<html lang="en-us">
<head>
<base href="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Meteor-60-Seconds-Web@48d4007cb417492f5d728a5aeaa1907616858e04/">
<!-- ubg-add-game: https://github.com/ThatWirdGuy/Meteor-60-Seconds-Web/tree/48d4007cb417492f5d728a5aeaa1907616858e04 -->
  <meta charset="utf-8">
  <title>Meteor 60 Seconds!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script>
    window.onerror = function() { return true; };
    window.onunhandledrejection = function() { return true; };
    window.alert = function() {};
    window.confirm = function() { return true; };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Meteor-60-Seconds-Web@48d4007cb417492f5d728a5aeaa1907616858e04/Build/UnityLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {overflow: hidden; background: black; }
    #gameContainer { width: 100vw; height: 100vh; }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">Loading <span id="loadMB">0.0</span> / 17.7 MB</div>
  <div id="gameContainer"></div>
  <script>
    var TOTAL_MB = 17.7;
    function myProgress(gameInstance, progress) {
      document.getElementById('loadMB').innerText = (progress * TOTAL_MB).toFixed(1);
      if (progress === 1) {
        document.getElementById('loadingScreen').style.display = 'none';
      }
    }
    try {
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Meteor-60-Seconds-Web@48d4007cb417492f5d728a5aeaa1907616858e04/Build/FIles.json",
        { onProgress: myProgress }
      );
    } catch(e) {}
  </script>
</body>
</html>
