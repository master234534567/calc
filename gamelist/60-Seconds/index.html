<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>60 Seconds</title>
  <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/Image.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/TemplateData/style.css">
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");
    const baseUrl = "https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/";
    const buildUrl = baseUrl + "Build";

    function showWarning(message, type) {
      const banner = document.createElement("div");
      banner.textContent = message;
      banner.style.cssText = type === "error"
        ? "background:#b91c1c;padding:10px;color:white"
        : "background:#facc15;padding:10px;color:black";
      warningBanner.appendChild(banner);
      warningBanner.style.display = "block";
      if (type !== "error") setTimeout(() => banner.remove(), 5000);
    }

    async function loadGame() {
      try {
        loadingBar.style.display = "block";
        const parts = ["Build.data.unityweb.0", "Build.data.unityweb.1", "Build.data.unityweb.2", "Build.data.unityweb.3", "Build.data.unityweb.4", "Build.data.unityweb.5"];
        const responses = await Promise.all(parts.map(async (part) => {
          const response = await fetch(buildUrl + "/" + part);
          if (!response.ok) throw new Error("Could not load " + part + " (" + response.status + ")");
          return response.arrayBuffer();
        }));
        const totalBytes = responses.reduce((total, part) => total + part.byteLength, 0);
        const combined = new Uint8Array(totalBytes);
        let offset = 0;
        for (const part of responses) {
          combined.set(new Uint8Array(part), offset);
          offset += part.byteLength;
        }

        const config = {
          dataUrl: URL.createObjectURL(new Blob([combined])),
          frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
          codeUrl: buildUrl + "/Build.wasm.unityweb",
          streamingAssetsUrl: baseUrl + "StreamingAssets",
          companyName: "Robot Gentleman",
          productName: "60 Seconds",
          productVersion: "1.0",
          showBanner: showWarning,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          config.devicePixelRatio = 1;
          showWarning("WebGL builds are not supported on mobile devices.", "warning");
        }

        const loader = document.createElement("script");
        loader.src = buildUrl + "/Build.loader.js";
        loader.onerror = () => showWarning("Could not load the Unity game loader.", "error");
        loader.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = 100 * progress + "%";
          }).then(() => {
            loadingBar.style.display = "none";
          }).catch((error) => showWarning(String(error), "error"));
        };
        document.body.appendChild(loader);
      } catch (error) {
        showWarning(error.message || String(error), "error");
      }
    }

    loadGame();
  </script>
</body>
</html>
