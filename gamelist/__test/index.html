<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; }

#ruffle { position: absolute; inset: 0; }

/* ── Loading overlay ──────────────────────────────────────── */
#load {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d0d;
  transition: opacity 0.5s ease;
}
#load.out { opacity: 0; pointer-events: none; }

.lc {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  animation: fadein 0.4s ease both;
}
@keyframes fadein {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* Arc spinner */
.rs { width: 44px; height: 44px; }
.rt {
  fill: none;
  stroke: rgba(255,255,255,0.06);
  stroke-width: 2.5;
}
.ra {
  fill: none;
  stroke: #f07220;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 48 84;
  transform-origin: 22px 22px;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Wordmark */
.wm {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}
</style>
</head>
<body>

<div id="load">
  <div class="lc">
    <svg class="rs" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="rt" cx="22" cy="22" r="18"/>
      <circle class="ra" cx="22" cy="22" r="18"/>
    </svg>
    <span class="wm">UBGHyper</span>
  </div>
</div>

<div id="ruffle"></div>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { splashScreen: false };
</script>
<!-- Local ruffle for testing — production uses the CDN path -->
<script src="../ruffle/ruffle.js"></script>
<script>
function dismiss() {
  var el = document.getElementById('load');
  if (!el) return;
  el.classList.add('out');
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
}

window.addEventListener('DOMContentLoaded', function() {
  var ruffle = window.RufflePlayer.newest();
  var player = ruffle.createPlayer();
  var container = document.getElementById('ruffle');
  container.appendChild(player);
  player.style.width = '100%';
  player.style.height = '100%';

  // Load a local SWF for testing
  player.load('../Achievement-Unlocked/achievementunlocked.swf');

  player.addEventListener('playing', dismiss);
  player.addEventListener('loadeddata', dismiss);
  setTimeout(dismiss, 15000);
});
</script>
</body>
</html>
